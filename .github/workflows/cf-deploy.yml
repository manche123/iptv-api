name: Build & Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:          # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 复用你原来的安装 & 构建命令
      - name: Install deps
        run: |
          npm ci                 # 或 pnpm install / yarn --frozen-lockfile
      - name: Build aip_code
        run: |
          npm run build            # 生成 dist 目录（按你实际脚本改）

      # 2. 上传产物供下一步部署
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to CF Pages
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 3. 一键推送到 Cloudflare Pages
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 下面命令行按需要改：
          # pages deploy <产物目录> --project-name=<你在CF创建的project名>
          command: pages deploy dist --project-name=iptv --branch=main
