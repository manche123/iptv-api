name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [master]   # 你的默认分支是 master
  workflow_dispatch:     # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 安装依赖（无 package-lock.json 也能过）
      - name: Install deps
        run: npm install

      # 2. 构建产物（生成 dist 目录）
      - name: Build
        run: npm run build

      # 3. 把产物上传，供下游部署 job 使用
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to CF Pages
    steps:
      # 4. 下载产物
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      # 5. 一键部署到 Cloudflare Pages
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aip-code-pages --branch=main
