name: Build & Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: npm ci          # 确保已提交 package-lock.json

      - name: Build
        run: npm run build   # 生成 dist

      # 把「源码+产物」一起打包，供下游使用
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .             # 整个仓库打成 zip，包括 dist、package.json、wrangler.toml 等

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 先还原完整仓库
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      # 现在 package.json 有了，wrangler-action 就能正常执行
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aip-code-pages --branch=main
