name: Generate API Code and Deploy to Cloudflare

on:
  push:
    branches:
      - main # 或者您希望触发此操作的任何分支

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      # 1. 首先，签出您的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 运行您的 api_code 脚本 (这是您已有的步骤)
      # 假设它会生成一个或多个文件，例如在 'output' 文件夹中
      - name: Run API Code Generator
        run: |
          echo "Running your script..."
          mkdir -p output # 创建一个输出目录
          echo "This is my generated file content" > output/data.json # 示例：生成一个叫data.json 的文件
          # 在这里替换成您自己的真实命令

      # 3. 自动提交生成的文件 (这是新增的关键步骤)
      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 必填：本次提交的消息
          commit_message: 'chore: Auto-generate API files'

          # 可选：要提交的文件模式。'output/*' 表示提交 output 文件夹下的所有文件
          # 如果是所有文件，可以使用 '.'
          file_pattern: 'output/*'

          # 可选：提交到的分支，默认为当前分支
          branch: main
