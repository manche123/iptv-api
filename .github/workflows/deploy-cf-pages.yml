name: Build aip_code → Deploy to CF Pages

on:
  push:
    branches: [main]   # 也可改成 master 或任意分支
  workflow_dispatch:   # 允许手动点 Run workflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # 让 Action 能写 GitHub Deployments
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build  # 这里按你 aip_code 的实际命令写
        run: |
          npm ci
          npm run build         # 如果构建命令是 npm run build:aip 就改这里
        # 构建完成后产物默认在 dist/；如目录不同，下面 directory 字段一起改

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME }}  # 或者直接写死字符串
          directory: dist                                   # 产物目录
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}          # 可选，用于回写部署状态
          branch: main                                      # 发布到 Pages 的生产环境
